<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Worker 控制台</title>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const hash = location.hash;
        document.documentElement.dataset.consoleRoute =
          hash === "" || hash === "#/"
            ? "onboarding"
            : hash === "#/login" || hash === "#/profile"
              ? "account"
              : hash === "#/settings"
                ? "settings"
                : "neutral";
        const mode = params.get("theme");
        const dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark ? "hsl(220 24% 4%)" : "hsl(220 20% 96%)";
        const color = params.get("theme_color");
        if (["teal", "blue", "purple", "pink", "orange", "green"].includes(color)) {
          document.documentElement.dataset.brand = color;
        }
        if (params.get("transition") === "1" && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("desktop-shell-entering");
        }
      })();
    </script>
    <style>
      /* Renders before the Vue bundle so native-window startup never exposes a blank rail. */
      .console-rail-bootstrap {
        --bootstrap-ink: 220 10% 66%;
        --bootstrap-brand: 175 72% 40%;
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 30;
        display: flex;
        width: 68px;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 0;
        background: #08090d;
        color: hsl(var(--bootstrap-ink));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        backdrop-filter: blur(8px);
        box-sizing: border-box;
      }
      html[data-theme="light"] .console-rail-bootstrap {
        --bootstrap-ink: 220 12% 42%;
        background: #f3f4f7;
      }
      html[data-brand="blue"] .console-rail-bootstrap { --bootstrap-brand: 217 76% 52%; }
      html[data-brand="purple"] .console-rail-bootstrap { --bootstrap-brand: 262 60% 55%; }
      html[data-brand="pink"] .console-rail-bootstrap { --bootstrap-brand: 330 70% 55%; }
      html[data-brand="orange"] .console-rail-bootstrap { --bootstrap-brand: 25 92% 52%; }
      html[data-brand="green"] .console-rail-bootstrap { --bootstrap-brand: 145 62% 40%; }
      .console-rail-bootstrap__item {
        display: flex;
        width: 56px;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 2px;
        border-radius: 10px;
        color: inherit;
        font: inherit;
        font-size: 11px;
        line-height: 1.25;
        box-sizing: border-box;
      }
      html[data-console-route="account"] [data-console-rail="account"],
      html[data-console-route="settings"] [data-console-rail="settings"],
      html[data-console-route="research"] [data-console-rail="research"] {
        background: hsl(var(--bootstrap-brand) / 0.16);
        color: hsl(var(--bootstrap-brand));
      }
      .console-rail-bootstrap__icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .console-rail-bootstrap__bottom { margin-top: auto; }
      .console-rail-bootstrap__theme { margin-bottom: 6px; }
      html[data-theme="dark"] [data-bootstrap-theme="light"],
      html[data-theme="light"] [data-bootstrap-theme="dark"],
      html[data-console-route="onboarding"] .console-rail-bootstrap { display: none; }
    </style>
  </head>
  <body>
    <aside id="console-rail-bootstrap" class="console-rail-bootstrap" aria-hidden="true">
      <div class="console-rail-bootstrap__item" data-console-rail="account">
        <svg class="console-rail-bootstrap__icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        <span>账户</span>
      </div>
      <div class="console-rail-bootstrap__item" data-console-rail="research">
        <svg class="console-rail-bootstrap__icon" viewBox="0 0 24 24"><path d="m10 12-6 2-1-3 14-5"/><path d="m16 21-3-6"/><path d="m8 21 3-6"/><circle cx="12" cy="13" r="2"/></svg>
        <span>研究</span>
      </div>
      <div class="console-rail-bootstrap__bottom">
        <div class="console-rail-bootstrap__item console-rail-bootstrap__theme" data-bootstrap-theme="light">
          <svg class="console-rail-bootstrap__icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
          <span>浅色</span>
        </div>
        <div class="console-rail-bootstrap__item console-rail-bootstrap__theme" data-bootstrap-theme="dark">
          <svg class="console-rail-bootstrap__icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span>深色</span>
        </div>
        <div class="console-rail-bootstrap__item" data-console-rail="settings">
          <svg class="console-rail-bootstrap__icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2 2-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-3v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-2-2 .1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H5.5v-3h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2-2 .1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h3v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 2 2-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v3H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          <span>设置</span>
        </div>
      </div>
    </aside>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

  </body>
</html>
