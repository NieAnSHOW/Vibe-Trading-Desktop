<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Worker — your professional financial agent team</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        if (params.get("desktop") === "1" && params.get("shell") !== "frame")
          document.documentElement.classList.add("desktop-shell");
        const mode = params.get("theme");
        const dark =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark
          ? "hsl(220 20% 5%)"
          : "hsl(220 20% 98%)";
        const color = params.get("theme_color");
        if (
          ["teal", "blue", "purple", "pink", "orange", "green"].includes(color)
        ) {
          document.documentElement.dataset.brand = color;
        }
        if (
          params.get("transition") === "1" &&
          !matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          document.documentElement.classList.add("desktop-shell-entering");
        }
      })();
    </script>
    <style>
      /* Covers the native document-navigation gap before React can mount. */
      .desktop-shell-rail-bootstrap {
        display: none;
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 30;
        width: 68px;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 0;
        background: hsl(0 0% 100% / 0.92);
        border-right: 1px solid hsl(220 16% 84%);
        color: hsl(220 12% 42%);
        font-family: Inter, system-ui, sans-serif;
        backdrop-filter: blur(8px);
        box-sizing: border-box;
      }
      html.desktop-shell .desktop-shell-rail-bootstrap {
        display: flex;
      }
      html.dark .desktop-shell-rail-bootstrap {
        background: hsl(220 20% 8% / 0.92);
        border-color: hsl(220 18% 18%);
        color: hsl(220 10% 66%);
      }
      html[data-brand="blue"] .desktop-shell-rail-bootstrap {
        --primary: 217 76% 52%;
      }
      html[data-brand="purple"] .desktop-shell-rail-bootstrap {
        --primary: 262 60% 55%;
      }
      html[data-brand="pink"] .desktop-shell-rail-bootstrap {
        --primary: 330 70% 55%;
      }
      html[data-brand="orange"] .desktop-shell-rail-bootstrap {
        --primary: 25 92% 52%;
      }
      html[data-brand="green"] .desktop-shell-rail-bootstrap {
        --primary: 145 62% 40%;
      }
      .desktop-shell-rail-bootstrap__item {
        display: flex;
        width: 56px;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 2px;
        border-radius: 10px;
        color: inherit;
        font: inherit;
        line-height: 1.25;
        box-sizing: border-box;
      }
      .desktop-shell-rail-bootstrap__item--active {
        background: hsl(var(--primary, 175 72% 40%) / 0.16);
        color: hsl(var(--primary, 175 72% 40%));
      }
      .desktop-shell-rail-bootstrap__icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .desktop-shell-rail-bootstrap__label {
        font-size: 11px;
      }
      .desktop-shell-rail-bootstrap__bottom {
        margin-top: auto;
      }
      .desktop-shell-rail-bootstrap__bottom-bot {
        margin-bottom: 6px;
      }
      html.dark [data-bootstrap-theme="light"],
      html:not(.dark) [data-bootstrap-theme="dark"] {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .desktop-shell-rail-bootstrap {
          transition: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Trading Worker — your professional financial agent team. Natural-language finance research, backtesting, swarm workflows, document reading, and multi-market analysis."
    />
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <aside
      id="desktop-shell-rail-bootstrap"
      class="desktop-shell-rail-bootstrap"
      aria-hidden="true"
    >
      <div class="desktop-shell-rail-bootstrap__item">
        <svg class="desktop-shell-rail-bootstrap__icon" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="5" />
          <path d="M20 21a8 8 0 0 0-16 0" />
        </svg>
        <span
          class="desktop-shell-rail-bootstrap__label"
          data-bootstrap-label="account"
          >账户</span
        >
      </div>
      <div
        class="desktop-shell-rail-bootstrap__item desktop-shell-rail-bootstrap__item--active"
      >
        <svg class="desktop-shell-rail-bootstrap__icon" viewBox="0 0 24 24">
          <path
            d="m10.065 12.493-6.18 1.318a.934.934 0 0 1-1.108-.702l-.537-2.15a1.07 1.07 0 0 1 .691-1.265l13.504-4.44"
          />
          <path d="m13.56 11.747 4.332-.924" />
          <path d="m16 21-3.105-6.21" />
          <path
            d="M16.485 5.94a2 2 0 0 1 1.455-2.425l1.09-.272a1 1 0 0 1 1.212.727l1.515 6.06a1 1 0 0 1-.727 1.213l-1.09.272a2 2 0 0 1-2.425-1.455z"
          />
          <path d="m6.158 8.633 1.114 4.456" />
          <path d="m8 21 3.105-6.21" />
          <circle cx="12" cy="13" r="2" />
        </svg>
        <span
          class="desktop-shell-rail-bootstrap__label"
          data-bootstrap-label="research"
          >研究</span
        >
      </div>
      <div class="desktop-shell-rail-bootstrap__bottom">
        <div
          class="desktop-shell-rail-bootstrap__item desktop-shell-rail-bootstrap__bottom-bot"
          data-bootstrap-theme="light"
        >
          <svg class="desktop-shell-rail-bootstrap__icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
          <span
            class="desktop-shell-rail-bootstrap__label"
            data-bootstrap-label="light"
            >浅色</span
          >
        </div>
        <div
          class="desktop-shell-rail-bootstrap__item desktop-shell-rail-bootstrap__bottom-bot"
          data-bootstrap-theme="dark"
        >
          <svg class="desktop-shell-rail-bootstrap__icon" viewBox="0 0 24 24">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
          <span
            class="desktop-shell-rail-bootstrap__label"
            data-bootstrap-label="dark"
            >深色</span
          >
        </div>
        <div class="desktop-shell-rail-bootstrap__item">
          <svg class="desktop-shell-rail-bootstrap__icon" viewBox="0 0 24 24">
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span
            class="desktop-shell-rail-bootstrap__label"
            data-bootstrap-label="settings"
            >设置</span
          >
        </div>
      </div>
    </aside>
    <script>
      (() => {
        const lang = localStorage.getItem("i18nextLng") || "zh-CN";
        const labels = {
          en: {
            account: "Account",
            research: "Research",
            settings: "Settings",
            light: "Light",
            dark: "Dark",
          },
          ja: {
            account: "アカウント",
            research: "リサーチ",
            settings: "設定",
            light: "ライト",
            dark: "ダーク",
          },
          ko: {
            account: "계정",
            research: "리서치",
            settings: "설정",
            light: "라이트",
            dark: "다크",
          },
          ar: {
            account: "الحساب",
            research: "بحث",
            settings: "الإعدادات",
            light: "فاتح",
            dark: "داكن",
          },
        };
        const copy = labels[lang.slice(0, 2)] || null;
        if (copy)
          document
            .querySelectorAll("[data-bootstrap-label]")
            .forEach((node) => {
              const key = node.getAttribute("data-bootstrap-label");
              if (key && copy[key]) node.textContent = copy[key];
            });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
